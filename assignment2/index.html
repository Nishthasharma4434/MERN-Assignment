<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link ref="stylesheet" href="./Assignment2.css"/>
    
</head>
<body>
   <h1>Application forms</h1>
    <form id="forms">
      <ul>
        <li>Student internship applicattion / *Required</li>
        <li>Personal details / fieldset + legend</li>
    </ul>
    <label for="Fullname">Full Name:</label>
    <input id="Fullname" type="text" placeholder="nishtha sharma" name="username" required/>
    <br></br>
    <label for="email">Email:</label>
    <input id="email" type="email" placeholder="xyz@gmail.com" name="useremail" required/>
    <br></br>
    <label for="password">password:</label>
    <input id="password" type="password" placeholder="123@abc" name="userpassword"/>
    <br></br>
    <label for="contact no.">Contact no.</label>
    <input id="contact no." type="tel" placeholder="1234567890" name="contact no."/>
    <br></br>
    <label for="URL">Portfolio URL:</label>
    <input id="URL" type="url" placeholder="https://example.com" name="url"/>
    <br></br>
    <label for="age">Age:</label>
    <input id="age" type="text" placeholder="20" name="userage"/>
    <br></br>
    <p>gender:</p>
    <label for="male">Male</label>
    <input id="male" type="radio" name="gender" value="male"/>
    <label for="female">Female</label>
    <input id="female" type="radio" name="gender" value="female"/>
    <label for="other">Others/Preffered not to say</label>
    <input id="other" type="radio" name="Others/Preffered not to say"/>
    <p>Education / fieldset + legend</p>
    <label for="course">Course</label>
    <input id="course" type="text" name="course" placeholder="Btech CSE"/>
    <label for="preferred city">Preferred city (datalist)</label>
    <input id="preferred city" type="radio" placeholder="bareilly" name="city" required>
    <p>Skills:</p>
    <label for="HTML">HTML</label>
    <input id="HTML" type="checkbox" name="html"/>
    <label for="CSS">CSS</label>
    <input id="CSS" type="checkbox" name="css"/>


    </form>

    
</body>
</html>
